<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <linearGradient id="goldGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>
    <radialGradient id="orbitalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(212,160,23,0.3)"/>
      <stop offset="70%" stop-color="rgba(212,160,23,0.1)"/>
      <stop offset="100%" stop-color="rgba(212,160,23,0)"/>
    </radialGradient>
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#D4A017" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with orbital glow -->
  <circle cx="320" cy="320" r="280" fill="url(#orbitalGlow)"/>
  
  <!-- Orbital ring -->
  <circle cx="320" cy="320" r="260" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 320 320" to="360 320 320" dur="20s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner orbital ring -->
  <circle cx="320" cy="320" r="220" fill="none" stroke="url(#goldGradient)" stroke-width="1" opacity="0.2">
    <animateTransform attributeName="transform" type="rotate" from="360 320 320" to="0 320 320" dur="30s" repeatCount="indefinite"/>
  </circle>
  
  <!-- VAL Monogram -->
  <g filter="url(#goldGlow)">
    <text x="320" y="365" font-family="Helvetica, Arial, sans-serif" font-size="200" font-weight="800" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="8">VAL</text>
  </g>
  
  <!-- Star accent -->
  <polygon points="320,120 328,145 355,150 332,170 338,198 320,185 302,198 308,170 285,150 312,145" fill="url(#goldGradient)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </polygon>
  
  <!-- DIGITAL SERVICES text -->
  <text x="320" y="480" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#FFD700" text-anchor="middle" letter-spacing="8" opacity="0.8">DIGITAL SERVICES</text>
</svg>